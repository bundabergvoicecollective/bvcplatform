<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Browser tab. Two sizes so the browser picks rather than downscales a
         192 into 16 and turns the letters to mush. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bundaberg Voice Collective</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2a8c8c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BVC" />
    <!-- iPhone and iPad home screen. 180x180 is the size iOS asks for; it
         ignores the manifest entirely and uses this.
         The file is deliberately square-cornered and fully opaque: iOS applies
         its own squircle mask, so a pre-rounded icon gets rounded twice and
         shows dark wedges at the corners, and iOS composites any transparency
         onto black rather than onto the page colour. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { font-family: 'Inter', sans-serif; }
      .font-display { font-family: 'Playfair Display', serif; }
    </style>
  </head>
  <body>
    <!-- Something to look at while the bundle arrives, and — more importantly —
         something other than a blank white screen if it never does. A member
         who taps the Home Screen icon and sees nothing at all concludes the
         app is broken and does not try again. -->
    <div id="root">
      <div id="boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0e1a2b;color:#f5f5f0;font-family:system-ui,sans-serif;padding:24px;text-align:center;">
        <img src="/icons/icon-192.png" alt="" width="72" height="72" style="border-radius:16px;" />
        <p id="boot-text" style="margin:0;font-size:15px;opacity:.75;">Loading…</p>
        <button
          id="boot-retry"
          hidden
          onclick="location.reload()"
          style="display:none;padding:10px 20px;border-radius:8px;border:0;background:#c9922a;color:#0e1a2b;font-size:15px;font-weight:600;"
        >
          Try again
        </button>
      </div>
    </div>
    <script>
      // React replaces everything inside #root when it mounts, so if this is
      // still here after a while the app never started. Say so, and give them
      // a button, rather than leaving a white screen with no way out.
      setTimeout(function () {
        var boot = document.getElementById("boot");
        if (!boot || !boot.isConnected) return;
        var text = document.getElementById("boot-text");
        var retry = document.getElementById("boot-retry");
        if (text) text.textContent = "This is taking longer than it should.";
        if (retry) { retry.hidden = false; retry.style.display = "inline-block"; }
      }, 15000);
    </script>
    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
