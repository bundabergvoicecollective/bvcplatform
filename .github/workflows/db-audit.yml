# Database and site audits, run on demand.
#
# The cloud container these sessions run in cannot reach the deployed site or
# the database, so the admin diagnostics at /api/admin/email-check are only
# reachable from a browser. This runs the same questions against the database
# directly.
#
# Most audits are read-only. The ones that can write — `mediaurls`,
# `recordpayment`, `newrehearsal` — report by default and write only when
# `apply` is ticked.
#
# The Manus migration steps were removed on 27 October 2026, once the cookie
# that let them reach the old site was deleted. They are in the history if a
# question about the migration ever needs answering.
name: Database audit

on:
  workflow_dispatch:
    inputs:
      audit:
        description: Which audit to run
        type: choice
        required: true
        default: emails
        options:
          - emails
          - members
          - recency
          - schema
          - media
          - income
          - paymenttrace
          - recordpayment
          - emailprobe
          - resendlookup
          - passdrift
          - preflight
          - mediaurls
          - newrehearsal
      apply:
        description: "Write the changes (mediaurls, recordpayment and newrehearsal only)"
        type: boolean
        required: false
        default: false
      args:
        description: "Extra arguments, e.g. --email=x@y.com, --site=https://…, --date=2026-11-03T18:30"
        type: string
        required: false
        default: ""

env:
  # TiDB connection details (not secret; the password is the DB_PASSWORD secret)
  DB_HOST: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
  DB_PORT: "4000"
  DB_USER: 3JSdBrsm7qtoEPs.root
  DB_NAME: bvc

jobs:
  audit:
    name: Audit the database
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same resolution as deploy.yml: an explicit DATABASE_URL secret wins,
      # otherwise it is assembled from DB_PASSWORD and the values above.
      - name: Resolve database URL
        env:
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import os, urllib.parse
          url = os.environ.get("DATABASE_URL_SECRET", "").strip()
          if not url:
              pw = urllib.parse.quote(os.environ["DB_PASSWORD"].strip(), safe="")
              url = (f"mysql://{os.environ['DB_USER']}:{pw}@{os.environ['DB_HOST']}:"
                     f"{os.environ['DB_PORT']}/{os.environ['DB_NAME']}"
                     '?ssl={"rejectUnauthorized":true}')
          print(f"::add-mask::{url}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"DATABASE_URL={url}\n")
          EOF

      - name: Audit email addresses
        if: inputs.audit == 'emails'
        run: pnpm exec tsx scripts/emailAudit.ts

      - name: Check member readiness
        if: inputs.audit == 'members'
        run: pnpm exec tsx scripts/memberReadiness.ts

      - name: Check how current the data is
        if: inputs.audit == 'recency'
        run: pnpm exec tsx scripts/dataRecency.ts

      # The R2 credentials are passed so the audit can ask the bucket whether
      # each file is really in there. Without them it can only report where
      # rows point, and a working path looks exactly like a broken one.
      - name: Check where the media files point
        if: inputs.audit == 'media'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: bvc-storage
        run: pnpm exec tsx scripts/mediaAudit.ts

      - name: Check what income is recorded
        if: inputs.audit == 'income'
        run: pnpm exec tsx scripts/incomeCheck.ts

      - name: Trace a payment
        if: inputs.audit == 'paymenttrace'
        env:
          ARGS: ${{ inputs.args }}
        run: pnpm exec tsx scripts/paymentTrace.ts $ARGS

      # Records a payment that reached the bank and never reached here, and
      # credits the sessions. Reports unless `apply` is ticked, and refuses to
      # record the same amount for the same member twice.
      - name: Record a payment taken outside the platform
        if: inputs.audit == 'recordpayment'
        env:
          ARGS: ${{ inputs.args }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ -z "$ARGS" ]; then
            echo "::error::Pass arguments, e.g. --email=someone@example.com --pass=5-pass --method=square"
            exit 1
          fi
          if [ "$APPLY" = "true" ]; then
            pnpm exec tsx scripts/recordPayment.ts $ARGS --apply
          else
            pnpm exec tsx scripts/recordPayment.ts $ARGS
          fi

      # What became of one message, by id. A GET against Resend — sends
      # nothing, changes nothing — and it never prints the body, because a
      # setup or invite link carries a working token and this log is public.
      - name: Look a message up at Resend
        if: inputs.audit == 'resendlookup'
        env:
          # SMTP_PASS is a Sending-access key and Resend refuses reads with
          # it. RESEND_API_KEY is for a Full-access key, and is used instead
          # when it exists; the step still runs without one and says why.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ARGS: ${{ inputs.args }}
        run: |
          if [ -z "$ARGS" ]; then
            echo "::error::Pass the id, e.g. --id=01a151b1-3826-7316-a475-992198055757"
            exit 1
          fi
          pnpm exec tsx scripts/resendLookup.ts $ARGS

      # Does outbound email actually leave, and what does Resend say about it?
      # Connects and logs in by default; `apply` ticked posts one real message
      # to the address in `args`, and to nobody else.
      - name: Probe outbound email
        if: inputs.audit == 'emailprobe'
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ARGS: ${{ inputs.args }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            pnpm exec tsx scripts/emailProbe.ts $ARGS --send
          else
            pnpm exec tsx scripts/emailProbe.ts $ARGS
          fi

      - name: Check attendance against pass deductions
        if: inputs.audit == 'passdrift'
        run: pnpm exec tsx scripts/passDriftAudit.ts

      # Creates tonight's rehearsal row when the admin dialog will not. Takes
      # --date in Brisbane time and refuses a second session on a day that
      # already has one. Reports unless `apply` is ticked.
      - name: Create a rehearsal session
        if: inputs.audit == 'newrehearsal'
        env:
          ARGS: ${{ inputs.args }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ -z "$ARGS" ]; then
            echo "::error::Pass the date, e.g. --date=2026-10-27T18:30 --title=\"October 27 Rehearsal\""
            exit 1
          fi
          if [ "$APPLY" = "true" ]; then
            pnpm exec tsx scripts/createRehearsal.ts $ARGS --apply
          else
            pnpm exec tsx scripts/createRehearsal.ts $ARGS
          fi

      # The URL in a media row and the key in the same row can name different
      # objects, and the page is built from the URL while every audit asks the
      # bucket about the key — so this breaks silently and audits clean. It is
      # how all 110 library items and 12 photos came to 404 on 27 October.
      # Reports unless `apply` is ticked; only ever rewrites a URL or a key.
      - name: Repair media rows whose URL and key disagree
        if: inputs.audit == 'mediaurls'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: bvc-storage
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            pnpm exec tsx scripts/mediaUrlRepair.ts --apply
          else
            pnpm exec tsx scripts/mediaUrlRepair.ts
          fi

      # The whole-site check before a rehearsal: does the deployed app answer,
      # does the API, do the stored files come back, and does a session row
      # exist for tonight. Read-only — it signs nobody in and writes no row.
      # It needs the live site, which the cloud sessions cannot reach, so it
      # runs here.
      - name: Pre-rehearsal check
        if: inputs.audit == 'preflight'
        env:
          SITE: https://members.bundabergvoicecollective.com.au
          ARGS: ${{ inputs.args }}
        run: pnpm exec tsx scripts/preflight.ts $ARGS

      - name: Report schema differences
        if: inputs.audit == 'schema'
        run: |
          rm -rf /tmp/bvc-schema-sql
          pnpm exec drizzle-kit generate --name=baseline --out=/tmp/bvc-schema-sql \
            --schema=./drizzle/schema.ts --dialect=mysql
          pnpm exec tsx scripts/dbSchema.ts --from=/tmp/bvc-schema-sql/0000_baseline.sql
