name: Deploy Firebase Hosting

# Firebase Hosting exists only to put a custom domain in front of the Cloud Run
# service: Cloud Run domain mapping is not offered in australia-southeast1.
# Every request is rewritten to the "bvc-production" service (see firebase.json),
# so this only needs redeploying when firebase.json itself changes.
#
# Manual trigger by design. The hosting site and the custom domain are set up
# once in the Firebase console (adding a domain needs DNS verification), and
# this workflow would fail until that is done.

on:
  workflow_dispatch:

jobs:
  hosting:
    name: Deploy Firebase Hosting
    runs-on: ubuntu-latest
    concurrency: firebase-hosting

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # firebase-tools picks up GOOGLE_APPLICATION_CREDENTIALS, which the auth
      # step above exports. The service account needs the Firebase Hosting Admin
      # role on the project; if it does not have it, this step is where it fails.
      - name: Deploy hosting
        run: npx --yes firebase-tools@13 deploy --only hosting --non-interactive
