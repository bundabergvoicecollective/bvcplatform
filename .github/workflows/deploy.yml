name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: australia-southeast1
  SERVICE: bvc-production
  REGISTRY: australia-southeast1-docker.pkg.dev
  # TiDB connection details (not secret; the password is the DB_PASSWORD secret)
  DB_HOST: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
  DB_PORT: "4000"
  DB_USER: 3JSdBrsm7qtoEPs.root
  DB_NAME: bvc
  # Origin used to build emailed password set-up / reset links. Must be set:
  # without it the link is built from the request's Host header, so a forged
  # header would send a member a real token pointing at someone else's domain.
  #
  # Whatever goes here has to preserve the path and query string, or a reset
  # link arrives with its token stripped. A GoDaddy domain forward does not —
  # it only bounces visitors to the site root — so this needs a real proxy.
  # See docs/members-domain.md: once bundabergvoicecollective.com is served
  # through Cloudflare, set the APP_URL secret to that domain. Until then the
  # fallback below keeps emailed links working on the run.app host.
  APP_URL: ${{ secrets.APP_URL || 'https://bvc-production-aoxblokwyq-ts.a.run.app' }}

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    concurrency: deploy-group
    env:
      HAS_DB: ${{ secrets.DATABASE_URL != '' || secrets.DB_PASSWORD != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Docker build uses esbuild, which strips types without checking them.
      # Without this step type errors ship straight to production.
      - name: Typecheck
        run: pnpm run check

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push Docker image
        run: |
          IMAGE="${REGISTRY}/${PROJECT_ID}/bvc/${SERVICE}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Database not configured yet
        if: env.HAS_DB != 'true'
        run: |
          echo "::warning::No DB_PASSWORD (or DATABASE_URL) secret is set. Image built and pushed, but not deployed (the app cannot start without a database)."

      - name: Resolve database URL
        if: env.HAS_DB == 'true'
        env:
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import os, urllib.parse
          url = os.environ.get("DATABASE_URL_SECRET", "").strip()
          if not url:
              pw = urllib.parse.quote(os.environ["DB_PASSWORD"].strip(), safe="")
              url = (f"mysql://{os.environ['DB_USER']}:{pw}@{os.environ['DB_HOST']}:"
                     f"{os.environ['DB_PORT']}/{os.environ['DB_NAME']}"
                     '?ssl={"rejectUnauthorized":true}')
          print(f"::add-mask::{url}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"DATABASE_URL={url}\n")
          EOF

      # Not `drizzle-kit push`: it stops on an interactive prompt ("you are about
      # to add invite_tokens_token_unique ... do you want to truncate?"), reports
      # the absent TTY, and then exits 0. Every deploy from the day the schema
      # gained its first unique constraint reported success while applying
      # nothing, which is why password_resets did not exist. The reconciler is
      # non-interactive, additive only, and exits non-zero when a statement
      # fails. Destructive changes — drops, renames, retypes — stay a deliberate
      # local `pnpm exec drizzle-kit push`, with someone watching the prompts.
      - name: Apply database schema
        if: env.HAS_DB == 'true'
        run: |
          rm -rf /tmp/bvc-schema-sql
          pnpm exec drizzle-kit generate --name=baseline --out=/tmp/bvc-schema-sql \
            --schema=./drizzle/schema.ts --dialect=mysql
          pnpm exec tsx scripts/dbSchema.ts --from=/tmp/bvc-schema-sql/0000_baseline.sql --apply

      # Only non-empty values are passed, so unset secrets fall back to the
      # app's built-in defaults (see _core/env.ts).
      - name: Build runtime env file
        if: env.HAS_DB == 'true'
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OWNER_OPEN_ID: ${{ secrets.OWNER_OPEN_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SQUARE_ENVIRONMENT: ${{ secrets.SQUARE_ENVIRONMENT }}
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          SQUARE_WEBHOOK_SIGNATURE_KEY: ${{ secrets.SQUARE_WEBHOOK_SIGNATURE_KEY }}
          SQUARE_WEBHOOK_URL: ${{ secrets.SQUARE_WEBHOOK_URL }}
        run: |
          python3 - <<'EOF'
          import json, os
          keys = ["DATABASE_URL","APP_URL","JWT_SECRET","OWNER_OPEN_ID","VAPID_PUBLIC_KEY","VITE_VAPID_PUBLIC_KEY",
                  "VAPID_PRIVATE_KEY","R2_ACCOUNT_ID","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY",
                  "R2_PUBLIC_URL","SMTP_PASS","SQUARE_ENVIRONMENT","SQUARE_ACCESS_TOKEN",
                  "SQUARE_LOCATION_ID","SQUARE_WEBHOOK_SIGNATURE_KEY","SQUARE_WEBHOOK_URL"]
          env = {"NODE_ENV": "production", "R2_BUCKET_NAME": "bvc-storage"}
          for k in keys:
              v = os.environ.get(k, "").strip()
              if v:
                  env[k] = v
          with open("/tmp/env.yaml", "w") as f:
              for k, v in env.items():
                  f.write(f"{k}: {json.dumps(v)}\n")
          print("Runtime vars set:", ", ".join(sorted(env)))
          EOF

      - name: Deploy to Cloud Run
        if: env.HAS_DB == 'true'
        run: |
          IMAGE="${REGISTRY}/${PROJECT_ID}/bvc/${SERVICE}:${GITHUB_SHA}"
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=3 \
            --memory=512Mi \
            --cpu=1 \
            --env-vars-file=/tmp/env.yaml \
            --quiet
          echo "URL: $(gcloud run services describe "$SERVICE" --region="$REGION" --format='value(status.url)')"

      # Old images are NOT pruned here. The github-deploy service account has
      # no artifactregistry.tags.delete, so a per-deploy delete only produced a
      # wall of PERMISSION_DENIED that buried the rest of the log. Retention is
      # handled by a cleanup policy on the "bvc" repository instead, which runs
      # server-side and needs no permissions from CI:
      #   Artifact Registry -> bvc -> Cleanup policies -> keep the 5 most recent
